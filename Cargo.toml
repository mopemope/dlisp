[workspace.package]
authors = ["mopemope <yutaka.matsubara@gmail.com>"]
description = "The Lisp dialect"
readme = "README.md"
license = "MIT/Apache-2.0"
edition = "2024"
version = "0.0.1"

[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "stdlib",
    "runtime"
]
# default-members = ["dlisp"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
chumsky = "0.9"
cranelift = "0.128.1"
cranelift-jit = "0.128.1"
cranelift-module = "0.128.1"
cranelift-native = "0.128.1"
cranelift-frontend = "0.128.1"
cranelift-codegen = "0.128.1"
cranelift-object = "0.128.1"
rustyline = "14.0"
tracing = "0.1"
dirs = "5.0"
# ... and other deps shared across crates if desired
