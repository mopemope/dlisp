[workspace.package]
authors = ["mopemope <yutaka.matsubara@gmail.com>"]
description = "The Lisp dialect"
readme = "README.md"
license = "MIT/Apache-2.0"
edition = "2024"
version = "0.0.1"

[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "stdlib",
    "runtime"
]
# default-members = ["dlisp"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
chumsky = "0.12"
cranelift = "0.128.1"
cranelift-jit = "0.128.1"
cranelift-module = "0.128.1"
cranelift-native = "0.128.1"
cranelift-frontend = "0.128.1"
cranelift-codegen = "0.128.1"
cranelift-object = "0.128.1"
rustyline = "17.0"
tracing = "0.1"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "fs", "process"] }
futures = { version = "0.3" }
async-recursion = { version = "1" }
dirs = "6.0"
# ... and other deps shared across crates if desired

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# The codebase consistently uses elided lifetimes on generic paths;
# annotating all of them would be high-churn with no safety benefit.
elided_lifetimes_in_paths = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
